spring:
  application:
    name: applytrack
  datasource:
    # Defaults match a local PostgreSQL started for development; override with environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/applytrack}
    username: ${DB_USER:applytrack}
    password: ${DB_PASSWORD:applytrack}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Histogram buckets let Prometheus compute latency percentiles (the p95 panel in Grafana).
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-components: always
      # Kubernetes probes: /actuator/health/liveness (is the process alive?) and /actuator/health/readiness
      # (can it serve requests?). Readiness also checks the database; liveness must not, or a database
      # outage would make Kubernetes restart every pod.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui
