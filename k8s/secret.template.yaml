# Template only: shows the shape of the Secret. It is not part of kustomization.yaml and must never
# hold real values. Create the real Secret directly, for example:
#   kubectl create namespace applytrack
#   kubectl -n applytrack create secret generic applytrack-db \
#     --from-literal=DB_USER=applytrack --from-literal=DB_PASSWORD='<choose a password>'
apiVersion: v1
kind: Secret
metadata:
  name: applytrack-db
  namespace: applytrack
type: Opaque
stringData:
  DB_USER: <database user>
  DB_PASSWORD: <database password>
