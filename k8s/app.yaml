apiVersion: apps/v1
kind: Deployment
metadata:
  name: applytrack
  labels:
    app: applytrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: applytrack
  template:
    metadata:
      labels:
        app: applytrack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # Without this, Kubernetes adds variables like DB_PORT=tcp://... for every Service, which could
      # clash with the app's own DB_ settings.
      enableServiceLinks: false
      # The app stops at startup if the database is not reachable yet, so wait for it first
      # (the same job docker compose does with depends_on: service_healthy).
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          # -U only stops pg_isready from looking up the name of the current user: uid 10001 has no entry in
          # this image, and without -U the check gives up ("no attempt") every time. No login happens.
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U applytrack; do echo waiting for db; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: applytrack
          # The tag (applytrack:ci) is set in kustomization.yaml, so apply with kubectl apply -k.
          image: applytrack
          # The image is built and loaded into kind, not pulled from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: applytrack-config
            - secretRef:
                name: applytrack-db
          env:
            # The JVM's default heap is a quarter of the memory limit; let it use most of it instead.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          # Startup: give the JVM and Flyway up to 2 minutes before the other probes start counting.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          # Liveness: is the process healthy? Failing restarts the container. No database check here.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: can it serve requests, database included? Failing removes the pod from the Service.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: applytrack
spec:
  selector:
    app: applytrack
  ports:
    - name: http
      port: 80
      targetPort: http
