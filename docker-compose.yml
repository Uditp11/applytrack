# The whole stack on one machine: docker compose up --build
# App http://localhost:8080 (Swagger UI at /swagger-ui), Prometheus http://localhost:9090, Grafana http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applytrack
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
    healthcheck:
      # Over TCP, so the temporary server that the image runs during first start does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U applytrack -d applytrack"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/applytrack
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Local demo only: viewers need no login; the admin password can be overridden.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
