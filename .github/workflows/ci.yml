name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t applytrack:ci .

      - name: Run the image and check health
        run: |
          docker run -d --name applytrack -p 8080:8080 applytrack:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Health is UP"
              exit 0
            fi
            sleep 2
          done
          docker logs applytrack
          exit 1
