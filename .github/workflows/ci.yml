name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Fail if any test was skipped
        # Database tests skip themselves when Docker is missing. CI has Docker, so a skip here means something broke.
        run: |
          if grep -l 'skipped="[1-9]' target/surefire-reports/TEST-*.xml; then
            echo "Some tests were skipped"
            exit 1
          fi

      - name: Build Docker image
        run: docker build -t applytrack:ci .

      - name: Run the image with PostgreSQL and check health
        run: |
          docker network create applytrack
          docker run -d --name db --network applytrack \
            -e POSTGRES_DB=applytrack -e POSTGRES_USER=applytrack -e POSTGRES_PASSWORD=applytrack \
            postgres:17-alpine
          # Ask over TCP: the image starts a temporary server on the Unix socket first.
          timeout 60 sh -c 'until docker exec db pg_isready -h 127.0.0.1 -U applytrack -d applytrack; do sleep 1; done'
          docker run -d --name applytrack --network applytrack -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://db:5432/applytrack \
            applytrack:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Health is UP"
              exit 0
            fi
            sleep 2
          done
          docker logs applytrack
          exit 1

  compose:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test the stack
        run: scripts/compose-smoke.sh

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  kind:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create a kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          cluster_name: applytrack

      - name: Build the image and load it into the cluster
        run: |
          docker build -t applytrack:ci .
          kind load docker-image applytrack:ci --name applytrack

      - name: Deploy
        run: |
          kubectl create namespace applytrack
          # A throwaway password for this test cluster only; real values never live in the repository.
          kubectl -n applytrack create secret generic applytrack-db \
            --from-literal=DB_USER=applytrack --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
          kubectl apply -k k8s/
          kubectl -n applytrack rollout status deployment/db --timeout=180s
          kubectl -n applytrack rollout status deployment/applytrack --timeout=300s

      - name: Smoke test through the Service
        run: |
          kubectl -n applytrack port-forward service/applytrack 8080:80 > port-forward.log 2>&1 &
          scripts/smoke.sh

      - name: Show cluster state if something failed
        if: failure()
        run: |
          kubectl -n applytrack get pods,services,events -o wide || true
          kubectl -n applytrack describe pods || true
          kubectl -n applytrack logs deployment/applytrack --all-containers --tail=200 || true
          cat port-forward.log || true
