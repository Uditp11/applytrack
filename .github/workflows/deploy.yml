# Deploys ApplyTrack to Azure, or removes it again. Runs only when started by hand (Actions tab, "Deploy to Azure").
# Needs the repository secrets printed by scripts/azure-bootstrap.sh. Login uses OpenID Connect: GitHub proves who
# is asking, Azure trusts this repository's main branch, and no Azure password or key is stored anywhere.
name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply = deploy or update, destroy = delete everything"
        required: true
        type: choice
        options: [apply, destroy]

permissions:
  contents: read
  id-token: write   # for the OpenID Connect login to Azure
  packages: write   # to push the image to GitHub Container Registry

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Build and push the image
        if: inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):$GITHUB_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The label links the package to this repository on GitHub.
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" .
          docker push "$image"
          echo "TF_VAR_image=$image" >> "$GITHUB_ENV"

      # Azure pulls the image without credentials, so the package must be public. GitHub makes new packages
      # private, and only the owner can switch one to public (once, in the package settings). Check before
      # creating anything in Azure.
      - name: Check that the image can be pulled anonymously
        if: inputs.action == 'apply'
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "$TF_VAR_image" > /dev/null; then
            echo "::error::The image is private. Make the package public once: GitHub > your profile > Packages > applytrack > Package settings > Change visibility > Public. Then run this workflow again."
            exit 1
          fi

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: terraform
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=applytrack.tfstate" \
            -backend-config="use_azuread_auth=true"
          # A budget starts on the first day of a month; the current month is accepted.
          export TF_VAR_budget_start_date="$(date -u +%Y-%m-01T00:00:00Z)"
          terraform apply -auto-approve -input=false
          echo "APP_URL=$(terraform output -raw app_url)" >> "$GITHUB_ENV"

      - name: Smoke test the deployed app
        if: inputs.action == 'apply'
        env:
          # The app starts from zero replicas and runs Flyway on 0.5 vCPU, so give it longer than in CI.
          SMOKE_WAIT_SECONDS: "240"
          CURL_MAX_TIME: "20"
        run: scripts/smoke.sh

      - name: Destroy everything
        if: inputs.action == 'destroy'
        run: scripts/teardown.sh
